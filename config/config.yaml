  # ZONE ATTIVE - commenta le zone da spegnere
  # Rimuovi tutta questa sezione per attivare
  # tutte le zone (comportamento di default)
  # ============================================
  active_zones:
    - dj
    - corridor
    - salon_left
    - salon_right
    - salon_back
    - bar_top
    - bar_floor_left
    - bar_floor_right
    - strips
    - extra
    # Zone composite supportate per convenienza:
    # - salon        (= salon_left + salon_right + salon_back)
    # - bar_floor    (= bar_floor_left + bar_floor_right)
    # - bar          (= bar_top + bar_floor_left + bar_floor_right)
recognition:
  enabled: true
  sample_duration: 5
  recognition_interval: 30
  cache_enabled: true
  cache_duration: 3600
ai_colors:
  enabled: true
  prompt_template: "Analizza questa canzone e suggerisci una palette di colori per\
    \ luci RGB.\n\nTitolo: {title}\nArtista: {artist}\nGenere: {genre}\nMood/Energia:\
    \ {mood}\nTesto (estratto): {lyrics_snippet}\n\nFornisci:\n1. Una palette di 3-5\
    \ colori in formato RGB (0-255)\n2. Il tipo di effetto consigliato (wave, strobe,\
    \ pulse, fade, static)\n3. La velocit\xE0 degli effetti (slow, medium, fast)\n\
    4. Una breve spiegazione della scelta\n\nRispondi SOLO in formato JSON:\n{\n \
    \ \"palette\": [[R,G,B], [R,G,B], ...],\n  \"effect_type\": \"wave\",\n  \"effect_speed\"\
    : \"medium\",\n  \"reasoning\": \"breve spiegazione\"\n}\n"
learning:
  enabled: true
  user_preference_weight: 0.7
  min_feedback_count: 3
web:
  host: 0.0.0.0
  port: 5040
  debug: false
  websocket_enabled: true
database:
  path: ./data/light_jockey.db
  backup_enabled: true
  backup_interval: 86400
logging:
  level: INFO
  file: ./logs/light_jockey.log
  max_size: 10
  backup_count: 5
